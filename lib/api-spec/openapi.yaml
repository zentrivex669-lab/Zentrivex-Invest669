openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Zentrivex Crypto Investment Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: plans
    description: Investment plans
  - name: investments
    description: User investments
  - name: deposits
    description: Deposits
  - name: withdrawals
    description: Withdrawals
  - name: kyc
    description: KYC verification
  - name: dashboard
    description: Dashboard summaries
  - name: admin
    description: Admin operations
  - name: referrals
    description: Referral program
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: OK

  /plans:
    get:
      operationId: listPlans
      tags: [plans]
      summary: List investment plans
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
    post:
      operationId: createPlan
      tags: [plans]
      summary: Create investment plan (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"

  /plans/{id}:
    get:
      operationId: getPlan
      tags: [plans]
      summary: Get plan by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
    patch:
      operationId: updatePlan
      tags: [plans]
      summary: Update plan (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
    delete:
      operationId: deletePlan
      tags: [plans]
      summary: Delete plan (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  /investments:
    get:
      operationId: listInvestments
      tags: [investments]
      summary: List user investments
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Investment"
    post:
      operationId: createInvestment
      tags: [investments]
      summary: Start investment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investment"

  /investments/{id}:
    get:
      operationId: getInvestment
      tags: [investments]
      summary: Get investment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investment"

  /investments/{id}/profit-history:
    get:
      operationId: getInvestmentProfitHistory
      tags: [investments]
      summary: Get daily profit accrual history for an investment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfitHistoryEntry"

  /deposits:
    get:
      operationId: listDeposits
      tags: [deposits]
      summary: List user deposits
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deposit"
    post:
      operationId: createDeposit
      tags: [deposits]
      summary: Submit deposit request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deposit"

  /withdrawals:
    get:
      operationId: listWithdrawals
      tags: [withdrawals]
      summary: List user withdrawals
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Withdrawal"
    post:
      operationId: createWithdrawal
      tags: [withdrawals]
      summary: Submit withdrawal request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  /kyc:
    get:
      operationId: getKyc
      tags: [kyc]
      summary: Get current user KYC status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kyc"
    post:
      operationId: submitKyc
      tags: [kyc]
      summary: Submit KYC documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kyc"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get user dashboard summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get admin dashboard summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboardSummary"

  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List all users
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /admin/users/{id}:
    get:
      operationId: getUser
      tags: [admin]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [admin]
      summary: Update user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/deposits:
    get:
      operationId: listAdminDeposits
      tags: [admin]
      summary: List all deposits (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deposit"

  /admin/deposits/{id}/approve:
    patch:
      operationId: approveDeposit
      tags: [admin]
      summary: Approve deposit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deposit"

  /admin/deposits/{id}/reject:
    patch:
      operationId: rejectDeposit
      tags: [admin]
      summary: Reject deposit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deposit"

  /admin/withdrawals:
    get:
      operationId: listAdminWithdrawals
      tags: [admin]
      summary: List all withdrawals (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Withdrawal"

  /admin/withdrawals/{id}/approve:
    patch:
      operationId: approveWithdrawal
      tags: [admin]
      summary: Approve withdrawal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  /admin/withdrawals/{id}/reject:
    patch:
      operationId: rejectWithdrawal
      tags: [admin]
      summary: Reject withdrawal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  /admin/kyc:
    get:
      operationId: listAdminKyc
      tags: [admin]
      summary: List all KYC submissions (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kyc"

  /admin/kyc/{id}/approve:
    patch:
      operationId: approveKyc
      tags: [admin]
      summary: Approve KYC
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kyc"

  /admin/kyc/{id}/reject:
    patch:
      operationId: rejectKyc
      tags: [admin]
      summary: Reject KYC
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kyc"

  /transactions:
    get:
      operationId: listTransactions
      tags: [dashboard]
      summary: List user transactions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /referrals:
    get:
      operationId: getReferrals
      tags: [referrals]
      summary: Get current user's referral stats and code
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralStats"

  /settings/referral:
    get:
      operationId: getReferralSettings
      tags: [referrals]
      summary: Get public referral program settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralSettings"

  /admin/settings/referral:
    put:
      operationId: updateReferralSettings
      tags: [admin]
      summary: Update referral program settings (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralSettings"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralSettings"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    RegisterInput:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: ["string", "null"]
        referralCode:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    User:
      type: object
      required: [id, email, firstName, lastName, role, balance, kycStatus, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [user, admin]
        balance:
          type: number
        kycStatus:
          type: string
          enum: [none, pending, approved, rejected]
        isActive:
          type: boolean
        referralCode:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    UserUpdate:
      type: object
      properties:
        isActive:
          type: boolean
        balance:
          type: number
        role:
          type: string
          enum: [user, admin]

    Plan:
      type: object
      required: [id, name, minAmount, maxAmount, roiPercent, durationDays, isActive]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        minAmount:
          type: number
        maxAmount:
          type: number
        roiPercent:
          type: number
        durationDays:
          type: integer
        isActive:
          type: boolean
        totalReturn:
          type: number
        createdAt:
          type: string
          format: date-time

    PlanInput:
      type: object
      required: [name, minAmount, maxAmount, roiPercent, durationDays]
      properties:
        name:
          type: string
        description:
          type: string
        minAmount:
          type: number
        maxAmount:
          type: number
        roiPercent:
          type: number
        durationDays:
          type: integer
        isActive:
          type: boolean

    PlanUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        minAmount:
          type: number
        maxAmount:
          type: number
        roiPercent:
          type: number
        durationDays:
          type: integer
        isActive:
          type: boolean

    Investment:
      type: object
      required: [id, userId, planId, amount, status, startDate, endDate, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        planId:
          type: integer
        amount:
          type: number
        status:
          type: string
          enum: [active, completed, cancelled]
        profit:
          type: number
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        plan:
          $ref: "#/components/schemas/Plan"
        createdAt:
          type: string
          format: date-time

    InvestmentInput:
      type: object
      required: [planId, amount]
      properties:
        planId:
          type: integer
        amount:
          type: number

    ProfitHistoryEntry:
      type: object
      required: [date, amount, cumulativeProfit]
      properties:
        date:
          type: string
          format: date-time
        amount:
          type: number
        cumulativeProfit:
          type: number
        description:
          type: ["string", "null"]

    Deposit:
      type: object
      required: [id, userId, amount, currency, walletAddress, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        amount:
          type: number
        currency:
          type: string
        walletAddress:
          type: string
        txHash:
          type: ["string", "null"]
        proofImage:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        rejectionReason:
          type: ["string", "null"]
        user:
          $ref: "#/components/schemas/User"
        createdAt:
          type: string
          format: date-time
        approvedAt:
          type: ["string", "null"]

    DepositInput:
      type: object
      required: [amount, currency, walletAddress]
      properties:
        amount:
          type: number
        currency:
          type: string
        walletAddress:
          type: string
        txHash:
          type: string
        proofImage:
          type: string

    Withdrawal:
      type: object
      required: [id, userId, amount, walletAddress, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        amount:
          type: number
        walletAddress:
          type: string
        network:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        rejectionReason:
          type: ["string", "null"]
        user:
          $ref: "#/components/schemas/User"
        createdAt:
          type: string
          format: date-time
        approvedAt:
          type: ["string", "null"]

    WithdrawalInput:
      type: object
      required: [amount, walletAddress]
      properties:
        amount:
          type: number
        walletAddress:
          type: string
        network:
          type: string

    Kyc:
      type: object
      required: [id, userId, documentType, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        documentType:
          type: string
          enum: [passport, drivers_license, national_id]
        frontImage:
          type: ["string", "null"]
        backImage:
          type: ["string", "null"]
        selfieImage:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        rejectionReason:
          type: ["string", "null"]
        user:
          $ref: "#/components/schemas/User"
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: ["string", "null"]

    KycInput:
      type: object
      required: [documentType]
      properties:
        documentType:
          type: string
          enum: [passport, drivers_license, national_id]
        fullName:
          type: string
        dateOfBirth:
          type: string
        nationality:
          type: string
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postalCode:
          type: string
        frontImage:
          type: string
        backImage:
          type: string
        selfieImage:
          type: string

    RejectInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    DashboardSummary:
      type: object
      required: [balance, totalInvested, totalProfit, totalDeposited, totalWithdrawn, activeInvestments]
      properties:
        balance:
          type: number
        totalInvested:
          type: number
        totalProfit:
          type: number
        totalDeposited:
          type: number
        totalWithdrawn:
          type: number
        activeInvestments:
          type: integer
        pendingDeposits:
          type: integer
        pendingWithdrawals:
          type: integer
        kycStatus:
          type: string

    AdminDashboardSummary:
      type: object
      required: [totalUsers, totalDeposits, totalWithdrawals, totalInvestments, pendingDeposits, pendingWithdrawals, pendingKyc, platformBalance]
      properties:
        totalUsers:
          type: integer
        totalDeposits:
          type: number
        totalWithdrawals:
          type: number
        totalInvestments:
          type: number
        pendingDeposits:
          type: integer
        pendingWithdrawals:
          type: integer
        pendingKyc:
          type: integer
        platformBalance:
          type: number
        recentDeposits:
          type: array
          items:
            $ref: "#/components/schemas/Deposit"
        recentWithdrawals:
          type: array
          items:
            $ref: "#/components/schemas/Withdrawal"

    Transaction:
      type: object
      required: [id, userId, type, amount, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
          enum: [deposit, withdrawal, investment, profit, referral]
        amount:
          type: number
        status:
          type: string
          enum: [pending, completed, failed]
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ReferralSettings:
      type: object
      required: [enabled, bonusPercent]
      properties:
        enabled:
          type: boolean
        bonusPercent:
          type: number

    ReferredUser:
      type: object
      required: [id, firstName, lastName, createdAt, hasDeposited]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        createdAt:
          type: string
          format: date-time
        hasDeposited:
          type: boolean

    ReferralStats:
      type: object
      required: [referralCode, referralLink, totalReferred, totalEarned, bonusPercent, enabled, referredUsers]
      properties:
        referralCode:
          type: string
        referralLink:
          type: string
        totalReferred:
          type: integer
        totalEarned:
          type: number
        bonusPercent:
          type: number
        enabled:
          type: boolean
        referredUsers:
          type: array
          items:
            $ref: "#/components/schemas/ReferredUser"
